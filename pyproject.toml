[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copixiv"
version = "2.0.0"
description = "Pixiv novel downloader and manager (v2 rewrite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 运行时依赖，不是测试专用：copixiv/notify/factory.py 在模块顶层
    # import telegram，而它 `import httpx`。build_notifier()
    # 在应用装配阶段就会被调用，所以只装 `pip install .`（不含 [dev]）时
    # 缺 httpx 会直接 ImportError，服务起不来。
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pixivpy3 @ git+https://github.com/upbit/pixivpy",
    "psycopg2-binary>=2.9",
    "croniter>=6.0",
    "requests>=2.31",
    "ebooklib>=0.18",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8",
    "alembic>=1.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
# 本地开发环境：pgserver 提供自带的 PG16 二进制（scripts/pg_dev.py 用它起
# 本地实例，端口 5433）。测试套件已于 2026-11-09 全部移除（用户决定重写），
# 新的门禁是 ruff / mypy / import-linter，见 [dependency-groups]。
dev = [
    "pgserver>=0.1.4",
]

[project.scripts]
copixiv = "copixiv.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copixiv"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copixiv"
version = "2.0.0"
description = "Pixiv novel downloader and manager (v2 rewrite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pixivpy3 @ git+https://github.com/upbit/pixivpy",
    "apscheduler>=3.10",
    "requests>=2.31",
    "langid>=1.1.6",
    "ebooklib>=0.18",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "jieba>=0.42",
    "python-dateutil>=2.8",
    "alembic>=1.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.scripts]
copixiv = "copixiv.app.main:main"

# Task plugins (docs/MODULARITY.md §M8): third-party packages install a
# task by declaring an entry point in this group.  Built-in tasks use the
# same mechanism when the package is installed; source-tree runs fall
# back to registry.DEFAULT_TASK_MODULES.
[project.entry-points."copixiv.tasks"]
novel_tasks = "copixiv.tasks.novel_tasks"
batch_tasks = "copixiv.tasks.batch_tasks"
maintenance = "copixiv.tasks.maintenance"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copixiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: long-running tests (migration chains / heavy concurrency). Default runs include them; CI may use '-m not slow' for a fast gate.",
]

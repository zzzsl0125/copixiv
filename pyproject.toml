[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copixiv"
version = "2.0.0"
description = "Pixiv novel downloader and manager (v2 rewrite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 运行时依赖，不是测试专用：httpx 同时驱动 Pixiv App API 客户端、异步图片下载与 Telegram 通知。
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "croniter>=6.0",
    "charset-normalizer>=3.0",
    "tenacity>=9.0",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
# 本地开发环境：pytest/ruff/mypy/import-linter/maturin 对应验证与 CI 门禁。
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.22",
    "ruff>=0.17",
    "mypy>=1.14",
    "import-linter>=2.1",
    "maturin>=1.7",
]
# 本地自托管 PostgreSQL 二进制（scripts/pg_dev.py 与 copixiv-pg.service）。
local-pg = [
    "pgserver>=0.1.4",
]

[project.scripts]
copixiv = "copixiv.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copixiv"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "I", "B", "UP", "SIM", "PT"]
ignore = [
    "E501",   # 行宽：110 是软约束，长 SQL 常量与注释允许超
    "E712",   # `col == True` 是 SQLAlchemy 的必需写法，改成裸列会被 PG 拒绝
    "E402",   # 本仓库刻意做函数级延迟 import（如 PIL 会增加 ~7 MiB RSS）
]

[tool.ruff.lint.isort]
known-first-party = ["copixiv"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src/copixiv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copixiv"
version = "2.0.0"
description = "Pixiv novel downloader and manager (v2 rewrite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pixivpy3 @ git+https://github.com/upbit/pixivpy",
    "psycopg2-binary>=2.9",
    "apscheduler>=3.10",
    "requests>=2.31",
    "langid>=1.1.6",
    "ebooklib>=0.18",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8",
    "alembic>=1.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
# 测试需要 PostgreSQL：pgserver 提供自带的 PG16 二进制（scripts/pg_dev.py
# 用它起本地实例，端口 5433），psycopg2-binary 是应用/测试共用的驱动。
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
copixiv = "copixiv.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copixiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: long-running tests (migration chains / heavy concurrency). CI runs '-m not slow' as the fast gate; run plain 'pytest' for the full suite.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copixiv"
version = "2.0.0"
description = "Pixiv novel downloader and manager (v2 rewrite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 运行时依赖，不是测试专用：copixiv/notify/factory.py 在模块顶层
    # import telegram，而它 `import httpx`。build_notifier()
    # 在应用装配阶段就会被调用，所以只装 `pip install .`（不含 [dev]）时
    # 缺 httpx 会直接 ImportError，服务起不来。
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pixivpy3 @ git+https://github.com/upbit/pixivpy",
    "psycopg2-binary>=2.9",
    "croniter>=6.0",
    "requests>=2.31",
    "ebooklib>=0.18",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.8",
    "alembic>=1.13",
    "loguru>=0.7",
]

[project.optional-dependencies]
# 本地开发环境：pgserver 提供自带的 PG16 二进制（scripts/pg_dev.py 用它起
# 本地实例，端口 5433）。测试套件已于 2026-11-09 全部移除（用户决定重写），
# 新的门禁是 ruff / mypy / import-linter。
dev = [
    "pgserver>=0.1.4",
    "ruff>=0.17",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# 起步只用真正能抓 bug 的规则集，不引入风格争议（E501 行宽交给 formatter 之外的
# 人眼判断，先不卡）。逐项放开的顺序建议：先 F/E/I，稳定后再 B/SIM/UP。
select = ["F", "E", "I"]
ignore = [
    "E501",   # 行宽：110 是软约束，长 SQL 常量与注释允许超
    "E712",   # `col == True` 是 SQLAlchemy 的必需写法，改成裸列会被 PG 拒绝
    "E402",   # 本仓库刻意做函数级延迟 import（PIL/ebooklib 会各加 7/11 MiB RSS）
    "F821",   # 文件普遍有 `from __future__ import annotations`，注解里的前向引用不是运行时错误
]

[tool.ruff.lint.isort]
known-first-party = ["copixiv"]

[tool.mypy]
python_version = "3.12"
# 渐进式严格：先只报"能确定是 bug"的错误，避免一次性几百条噪声淹没改动。
# 逐步升级顺序：check_untyped_defs → disallow_untyped_defs → strict。
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = false
ignore_missing_imports = true
mypy_path = "src"
files = ["src/copixiv"]

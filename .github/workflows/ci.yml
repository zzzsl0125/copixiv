name: CI

# 触发时机：push 到任意分支 + 任何 Pull Request。
# 同一分支上多次快速 push 时取消仍在运行的旧任务（节省额度）。
#
# 后端门禁：Rust fmt/clippy/test + ruff + mypy + import-linter + tests(unit+db+integration) +
# alembic check (PG16 services，无 pg_bigm 依赖) + OpenAPI 一致性。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust + ruff + mypy + import-linter + pytest + alembic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copixiv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COPIXIV_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/copixiv_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/copixiv_rs

      - name: Install dependencies and build Rust extension
        run: |
          uv sync --locked --extra dev
          uv pip install --no-build-isolation ./crates/copixiv_rs

      - name: Rust format check (cargo fmt)
        run: cargo fmt --manifest-path crates/copixiv_rs/Cargo.toml --check

      - name: Rust lint (cargo clippy)
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo clippy --manifest-path crates/copixiv_rs/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests (cargo test)
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --manifest-path crates/copixiv_rs/Cargo.toml

      - name: Lint and format check (ruff)
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src/copixiv

      - name: Layer contracts (import-linter)
        run: uv run --no-sync lint-imports

      - name: Apply Alembic baseline on empty PG16 and verify metadata parity
        run: |
          uv run --no-sync alembic -x "url=$COPIXIV_TEST_DATABASE_URL" upgrade head
          uv run --no-sync alembic -x "url=$COPIXIV_TEST_DATABASE_URL" check

      - name: Full backend tests and coverage (pytest)
        run: uv run --no-sync pytest tests -v --cov=copixiv

      - name: Verify ORM/Alembic metadata parity (alembic check)
        run: uv run --no-sync alembic -x "url=$COPIXIV_TEST_DATABASE_URL" check

      - name: Check OpenAPI schema is up to date
        run: |
          uv run --no-sync python -m copixiv.export_openapi > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (codegen + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types are up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/types/api.generated.ts

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Type-check and build
        run: npm run build

name: CI

# 触发时机：push 到任意分支 + 任何 Pull Request。
# 同一分支上多次快速 push 时取消仍在运行的旧任务（节省额度）。
#
# 后端门禁：Rust 单测 + ruff + mypy + import-linter + 纯单元测试（tests/unit）+ OpenAPI 一致性；
# tests/db 与 tests/integration 依赖带 pg_bigm 扩展的 PostgreSQL，在本地验证。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust + ruff + mypy + import-linter + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/copixiv_rs

      - name: Install dependencies and build Rust extension
        run: |
          pip install ".[dev]" ruff mypy import-linter maturin
          pip install --no-build-isolation ./crates/copixiv_rs

      - name: Rust unit tests (cargo test)
        run: PYO3_PYTHON="$(command -v python)" cargo test --manifest-path crates/copixiv_rs/Cargo.toml

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy)
        run: mypy src/copixiv

      - name: Layer contracts (import-linter)
        run: lint-imports

      - name: Unit tests (pytest)
        run: pytest tests/unit -v

      # 前端类型的唯一真相是后端导出的 OpenAPI：提交的 frontend/openapi.json
      # 必须与当前路由/模型一致，否则 openapi-typescript 生成的就是过期类型。
      - name: Check OpenAPI schema is up to date
        run: |
          python -m copixiv.export_openapi > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (codegen + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 生成文件是提交进仓库的：openapi-typescript 的产物若与 openapi.json
      # 不同步（比如手改了 src/types/api.generated.ts），这里直接失败。
      - name: Check generated API types are up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/types/api.generated.ts

      # 前端测试套件也已整体移除（2026-11-09）；构建含 vue-tsc 严格类型检查。
      - name: Type-check and build
        run: npm run build

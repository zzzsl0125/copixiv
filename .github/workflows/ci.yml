name: CI

# 触发时机：push 到任意分支 + 任何 Pull Request。
# 同一分支上多次快速 push 时取消仍在运行的旧任务（节省额度）。
#
# 2026-11-09：旧的 Python 测试套件（1100 用例 / 23k 行）已整体移除，
# 由用户决定重写。新增门禁：ruff + mypy + import-linter。旧套件里的
# pg_bigm 编译步骤只服务于那批用例，一并移除。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]" ruff mypy import-linter

      - name: Lint (ruff)
        run: ruff check src

      - name: Type-check (mypy)
        run: mypy src/copixiv

      - name: Layer contracts (import-linter)
        run: lint-imports

      # 前端类型的唯一真相是后端导出的 OpenAPI：提交的 frontend/openapi.json
      # 必须与当前路由/模型一致，否则 openapi-typescript 生成的就是过期类型。
      - name: Check OpenAPI schema is up to date
        run: |
          python -m copixiv.export_openapi > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 生成文件是提交进仓库的：openapi-typescript 的产物若与 openapi.json
      # 不同步（比如手改了 src/types/api.generated.ts），这里直接失败。
      - name: Check generated API types are up to date
        run: |
          npm run codegen
          git diff --exit-code -- src/types/api.generated.ts

      # 前端测试套件也已整体移除（2026-11-09）；构建含 vue-tsc 严格类型检查。
      - name: Type-check and build
        run: npm run build

name: CI

# 触发时机：push 到任意分支 + 任何 Pull Request。
# 同一分支上多次快速 push 时取消仍在运行的旧任务（节省额度）。
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # dev extras 含 pytest / pytest-asyncio / httpx / pgserver；pixivpy3
      # 是 git 依赖（pyproject 里的 direct reference），runner 自带 git。
      # 测试已迁移到 PostgreSQL：pip install ".[dev]" 会装入 pgserver（自带
      # PG16 二进制）和 psycopg2-binary；tests/conftest.py 通过
      # scripts/pg_dev.py 在 .spike/ 启动本地实例（端口 5433），全程离线、
      # 不需要真实 token。种子数据在缺少 database/database.db 时自动改用
      # 确定性合成样本，CI 无需任何外部数据文件。
      - name: Install dependencies
        run: pip install ".[dev]"

      # 快速门禁：CI 只跑非 slow 用例（含迁移链/并发在内的 slow 测试按需
      # 全量执行：python -m pytest，见 pyproject.toml 的 markers 注释）。
      - name: Run tests
        run: python -m pytest -q -m "not slow"

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      # vue-tsc 会连带对 tests/**/*.ts 做严格类型检查，再产出生产构建。
      - name: Type-check and build
        run: npm run build

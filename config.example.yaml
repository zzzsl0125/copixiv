# PostgreSQL 连接：本机开发默认指向 pg_dev.py 管理的 pgserver 实例（端口 5433）
database_url: postgresql+psycopg2://postgres@127.0.0.1:5433/copixiv
path:
  download: download
pixiv_client:
  min_interval: 2
  cooling_duration: 120
  max_concurrency: 5
# 通知后端：`notifications` 只支持 telegram；列表形状保留用于将来加渠道。
#   - type: telegram → token + chat_id
# 留空 [] 关闭所有通知。旧 telegram / notifiers.enabled / webhook 键已合并到此列表。
# 旧 env（如 COPIXIV_TELEGRAM__TOKEN / COPIXIV_WEBHOOK__URL）同样改为此列表。
notifications:
  - type: telegram
    token: "YOUR_TELEGRAM_BOT_TOKEN"
    chat_id: "YOUR_TELEGRAM_CHAT_ID"
# proxy 单键：同时用于 HTTP 与 HTTPS（env: COPIXIV_PROXY__URL）。
proxy:
  url: "127.0.0.1:20172"
# 前端默认筛选值（min_like / min_text）已内置前端源码，不再有 frontend 段。
batch_download:
  naming: "{author_name}/{series_name}/#{series_index}_{title}_{id}"
# 数据库备份：由「任务管理 → 定时任务」里的 backup_database 任务执行
# （建议每周一次，例如 cron `0 6 * * 6`）；保留份数由该任务参数 keep_count 控制。
# `dir` 相对仓库根；测试可用 env COPIXIV_BACKUP__DIR 覆盖目录。
backup:
  dir: backups
security:
  api_key: ""
  allowed_hosts: []         # 额外放行域名；allowed_origins 未配置时由此推导（:9000/:5173/:4173）
  # allowed_origins:        # 显式配置则原样使用（[] 禁用跨域）；省略则从 allowed_hosts 推导
  #   - "http://localhost:9000"
  #   - "http://localhost:5173"

path:
  token: pixiv_token.py
  database: database/database.db
  download: download
pixiv_client:
  min_interval: 2
  cooling_duration: 120
  max_concurrency: 5
telegram:
  token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_id: "YOUR_TELEGRAM_CHAT_ID"
# 通知后端（docs/MODULARITY.md §M6）：按名字装配，加渠道 = 新模块 + 一行配置
notifiers:
  enabled: [telegram]   # 可用: telegram, webhook；留空 [] 关闭所有通知
webhook:
  url: ""               # webhook 后端的 JSON 投递地址（空 = 该后端跳过）
frontend:
  default_min_like: 500
  default_min_text: 3000
proxy:
  http: "127.0.0.1:20172"
  https: "127.0.0.1:20172"
pixiv_accounts:
  follow: "YOUR_PIXIV_EMAIL"
batch_download:
  naming: "{author_name}/{series_name}/#{series_index}_{title}_{id}"
security:
  api_key: ""
  allowed_hosts: []
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:4173"
    - "http://127.0.0.1:4173"
